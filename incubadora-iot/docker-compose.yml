services:
  db:
    image: postgres:16-alpine
    container_name: incubadora-db
    environment:
      POSTGRES_USER: incubadora
      POSTGRES_PASSWORD: incubadora
      POSTGRES_DB: incubadora
    ports:
      - "5432:5432"
    volumes:
      - incubadora-pgdata:/var/lib/postgresql/data
volumes:
  incubadora-pgdata:
